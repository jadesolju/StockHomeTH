<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Outer Golden Ring Gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="50%" stop-color="#FFA751"/>
      <stop offset="100%" stop-color="#D48806"/>
    </linearGradient>

    <!-- Emerald Gemstone Body Gradient -->
    <radialGradient id="gemRadial" cx="50%" cy="45%" r="55%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#4EFFF8"/>
      <stop offset="35%" stop-color="#00D2B4"/>
      <stop offset="70%" stop-color="#008E76"/>
      <stop offset="100%" stop-color="#004D40"/>
    </radialGradient>

    <!-- Highlight Reflection -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="gemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Drop Shadow Base -->
  <circle cx="50" cy="52" r="44" fill="#000000" fill-opacity="0.35"/>

  <!-- Outer Golden Metallic Coin Rim -->
  <circle cx="50" cy="50" r="45" fill="url(#goldRing)" stroke="#FFF2A3" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="40" fill="#0D2824" stroke="#D48806" stroke-width="1.2"/>

  <!-- Faceted Emerald Gemstone Center -->
  <polygon points="50,16 78,32 78,68 50,84 22,68 22,32" fill="url(#gemRadial)" filter="url(#gemGlow)"/>

  <!-- Facet Polygon Lines (3D Gem Cut) -->
  <polygon points="50,16 66,36 50,42 34,36" fill="#A7FFEB" fill-opacity="0.35"/>
  <polygon points="66,36 78,32 78,68 66,62" fill="#004D40" fill-opacity="0.45"/>
  <polygon points="22,32 34,36 34,62 22,68" fill="#1DE9B6" fill-opacity="0.25"/>
  <polygon points="34,62 50,84 66,62 50,56" fill="#00382E" fill-opacity="0.55"/>
  
  <!-- Center Star Core Table -->
  <polygon points="50,30 63,45 50,60 37,45" fill="#E0F2F1" fill-opacity="0.6"/>
  <polygon points="50,34 59,45 50,55 41,45" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Sparkle Glint at Top-Left -->
  <circle cx="34" cy="30" r="2.5" fill="#FFFFFF" filter="url(#gemGlow)"/>
  <path d="M34,25 L34,35 M29,30 L39,30" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Inner Sparkle -->
  <circle cx="64" cy="62" r="1.5" fill="#FFE259"/>
</svg>
